<!DOCTYPE html>
<html>
<head>
    <title>Robot Platform Control</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: #1a1a1a; 
            color: #e0e0e0; 
            padding: 10px; 
            font-size: 14px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { 
            color: #4CAF50; 
            margin-bottom: 10px; 
            font-size: 20px;
        }
        .panel { 
            background: #2a2a2a; 
            border-radius: 5px; 
            padding: 12px; 
            margin-bottom: 10px; 
        }
        .panel h2 { 
            color: #4CAF50; 
            margin-bottom: 8px; 
            font-size: 15px;
        }
        .cmd-grid {
            display: grid;
            grid-template-columns: calc(50% - 25px) calc(50% + 25px);
            gap: 12px;
            margin-top: 10px;
        }
        .cmd-col h3 {
            color: #4CAF50;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: normal;
            opacity: 0.8;
        }
        .cmd-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .cmd-row button { 
            background: #4CAF50; 
            color: white; 
            border: none; 
            padding: 6px 10px; 
            border-radius: 3px; 
            cursor: pointer; 
            font-size: 12px;
            min-width: 80px;
            white-space: nowrap;
        }
        .cmd-row button:hover { background: #45a049; }
        .cmd-row button:active { background: #3d8b40; }
        .cmd-row button:disabled { background: #555; cursor: not-allowed; opacity: 0.5; }
        .cmd-row input[type="number"] {
            padding: 5px 6px;
            border: 1px solid #444;
            border-radius: 3px;
            background: #333;
            color: #e0e0e0;
            font-size: 12px;
            width: 55px;
        }
        .cmd-row input[type="checkbox"] {
            width: 14px;
            height: 14px;
            cursor: pointer;
        }
        .cmd-row label {
            font-size: 11px;
            color: #888;
        }

        #missionControl .cmd-row button {
            width: 110px;
            padding: 6px 12px;
            font-size: 12px;
            white-space: nowrap;
        }
        #missionControl input[type="number"] {
            width: 92px;
            padding: 6px 6px;
            font-size: 13px;
        }
        #param_mission_distance_mm,
        #param_mission_timeout_ms {
            width: 120px;
        }
        #param_mission_speed_mms,
        #param_mission_heading_deg {
            width: 70px;
        }
        @media (max-width: 600px) {
            #missionControl .cmd-row button { width: 100px; }
            #missionControl input[type="number"] { width: 72px; }
        }
        .odom-toggle {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 6px;
            font-size: 12px;
        }
        .send-mode {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 10px;
            font-size: 12px;
        }
        .send-mode input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        .input-group { 
            display: flex; 
            gap: 6px; 
            margin-bottom: 8px;
        }
        input[type="text"] { 
            flex: 1; 
            padding: 8px; 
            border: 1px solid #444; 
            border-radius: 3px; 
            background: #333; 
            color: #e0e0e0; 
            font-size: 13px;
        }
        input[type="text"]:focus, input[type="number"]:focus { 
            outline: none; 
            border-color: #4CAF50; 
        }
        #logs { 
            background: #1a1a1a; 
            border: 1px solid #444; 
            border-radius: 3px; 
            padding: 8px; 
            height: 250px; 
            overflow-y: auto; 
            font-family: 'Courier New', monospace; 
            font-size: 11px;
            line-height: 1.4;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 8px;
        }

        .panel-header h2 {
            margin-bottom: 0;
        }

        #clearLogsBtn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            white-space: nowrap;
        }

        #clearLogsBtn:hover { background: #45a049; }
        #clearLogsBtn:active { background: #3d8b40; }
        .log-entry { margin-bottom: 3px; }
        .log-entry.command { color: #4CAF50; }
        .log-entry.response { color: #64B5F6; }
        @media (max-width: 700px) {
            .cmd-grid {
                grid-template-columns: 1fr;
            }
        }
        @media (max-width: 600px) {
            body { padding: 5px; font-size: 12px; }
            h1 { font-size: 16px; margin-bottom: 8px; }
            .panel { padding: 10px; }
            .panel h2 { font-size: 13px; margin-bottom: 6px; }
            .cmd-row { gap: 4px; margin-bottom: 5px; }
            .cmd-row button { width: 80px; font-size: 11px; padding: 5px 6px; }
            .cmd-row input[type="number"] { width: 46px; padding: 4px; font-size: 11px; }
            .input-group { gap: 4px; }
            input[type="text"], select, input[type="number"] { padding: 6px; font-size: 12px; }
            #sendCustomBtn { padding: 6px 15px !important; font-size: 12px !important; }
            #logs { height: 180px; font-size: 10px; padding: 6px; }
            .container { max-width: 100%; }

            /* Mobile-only layout fixes */
            #customCmd { width: 115px !important; }

            #missionControlActions { flex-wrap: wrap; }
            #cancelMissionBtn, #emStopBtn {
                width: auto !important;
                min-width: 0 !important;
                white-space: normal !important;
                padding: 5px 8px !important;
                line-height: 1.1;
            }
            #cancelMissionBtn { flex: 1 1 140px; }
            #emStopBtn { flex: 1 1 160px; }

            /* Keep Ki label+input together and move to next line */
            .pid-top .pid-group.pid-ki { flex: 0 0 100%; }
        }

        .pid-bottom { margin-left: 238px; }

        .pid-top .pid-group,
        .pid-bottom .pid-group {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        @media (max-width: 600px) {
            .pid-bottom { margin-left: 24px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Robot Platform Control Panel</h1>
        
        <div class="panel">
            <h2>Commands</h2>
            <div class="send-mode">
                <input type="checkbox" id="instantSend" checked>
                <label for="instantSend">Instant send</label>
            </div>
            
            <div class="cmd-grid" id="commandGrid">
            </div>
            
            <div id="missionControl" style="margin-top: 15px;">
            </div>
        </div>
        
        <div class="panel">
            <h2>Custom Command</h2>
            <div class="input-group">
                <input type="text" id="customCmd" placeholder="command" style="width: 140px;">
                <select id="customType" style="width: 80px; padding: 8px; background: #333; color: #e0e0e0; border: 1px solid #444; border-radius: 3px;">
                    <option value="0">CMD</option>
                    <option value="1">RPM</option>
                </select>
                <input type="number" id="customValues" placeholder="#" min="0" style="width: 50px; padding: 8px; background: #333; color: #e0e0e0; border: 1px solid #444; border-radius: 3px;">
                <input type="text" id="customParams" placeholder="params" style="width: 120px;">
                <button id="sendCustomBtn" style="padding: 8px 20px; background: #4CAF50; color: white; border: none; border-radius: 3px; cursor: pointer; font-size: 13px;">Send</button>
            </div>
        </div>
        
        <div class="panel">
            <div class="panel-header">
                <h2>Log</h2>
                <button id="clearLogsBtn" type="button">Clear</button>
            </div>
            <div id="logs"></div>
        </div>
    </div>
    
    <script>
        let autoScroll = true;
        let lastLogId = 0;
        let pollInFlight = false;
        
        let missionBuildMode = false;
        let missionBuildString = '';
        let currentTaskActions = [];
        let isFirstAddTask = true;
        
        const commandConfig = {
            motors_set: {
                label: "Motors Set",
                type: 0,  // 0=CMD, 1=RPM
                params: [
                    { id: "speed", label: "Spd", default: 15.0, min: 0.0, max: 100.0, step: 0.5 },
                    { id: "direction", label: "Dir", default: 0, min: 0 },
                    { id: "control", label: "Ctrl", default: 0, min: 0 }
                ]
            },
            motors_stop: {
                label: "Motors Stop",
                type: 0,
                params: []
            },
            modom_set: {
                label: "Motors Set (Odom)",
                type: 0,
                params: [
                    { id: "speed", label: "Spd", default: 15.0, min: 0.0, max: 100.0, step: 0.5 },
                    { id: "direction", label: "Dir", default: 0, min: 0 },
                    { id: "control", label: "Ctrl", default: 0, min: 0 }
                ]
            },
            modom_stop: {
                label: "Motors Stop (Odom)",
                type: 0,
                params: []
            },
            motors_setrpm: {
                label: "Set RPM",
                type: 0,
                params: [
                    { id: "motor", label: "ID", default: 0, min: 0 },
                    { id: "target_rpm", label: "RPM", default: 80, min: 0, max: 400 },
                    { id: "mode", label: "Mode", default: 2, min: 0 }
                ]
            },
            motors_getrpm: {
                label: "Get RPM",
                type: 0,
                params: [
                    { id: "motor", label: "ID", default: 0, min: 0 }
                ]
            },
            motors_setpid: {
                label: "Set PID",
                type: 0,
                params: [
                    { id: "motor", label: "ID", default: 0, min: 0 },
                    { id: "Kp", label: "Kp", default: -1.0, min: -1.0 },
                    { id: "Ki", label: "Ki", default: -1.0, min: -1.0 },
                    { id: "Kd", label: "Kd", default: -1.0, min: -1.0 },
                    { id: "integral_limit", label: "I Lim", default: -1.0, min: -1.0 }
                ]
            },
            request_rpm: {
                label: "Request RPM",
                type: 0,
                params: []
            },
            read_rpm: {
                label: "Read RPM",
                type: 0,
                params: [
                    { id: "encoder", label: "ID", default: 0, min: 0 }
                ]
            },
            reset_odom: {
                label: "Reset Odom",
                type: 0,
                params: []
            },
            mission: {
                label: "Drive",
                type: 0,
                params: [
                    { id: "distance_mm", label: "Dist(mm)", default: 100, min: 0 },
                    { id: "speed_mms", label: "Spd(mm/s)", default: 200, min: 0, max: 10000 },
                    { id: "heading_deg", label: "Head(°)", default: 0, min: 0, max: 360 },
                    { id: "timeout_ms", label: "Timeout(ms)", default: 5000, min: 0 }
                ]
            },
            measure: {
                label: "Measure",
                type: 0,
                sensorCount: 3,
                params: []
            },
            wall_follow: {
                label: "Wall Follow",
                type: 0,
                params: [
                    { id: "speed", label: "Spd(%)", default: 15.0, min: 1.0, max: 100.0, step: 0.5 },
                    { id: "strategy", label: "Strategy", default: 2, min: 0, max: 2 },
                    { id: "target_offset_mm", label: "Target(mm)", default: 150, min: 0 },
                    { id: "timeout_ms", label: "Timeout(ms)", default: 0, min: 0 }
                ]
            },
            cancel: {
                label: "Cancel Mission",
                type: 0,
                params: [
                    { id: "mission_id", label: "ID", default: 0, min: 0 }
                ]
            },
            stop: {
                label: "Emergency Stop",
                type: 0,
                params: []
            }
        };
        
        function generateCommandUI() {
            const grid = document.getElementById('commandGrid');
            
            const leftCol = ['motors_set', 'motors_stop'];
            const rightCol = ['motors_setrpm', 'motors_getrpm', 'motors_setpid'];
            const missionCol = ['mission', 'measure', 'wall_follow'];
            
            const leftDiv = document.createElement('div');
            leftDiv.className = 'cmd-col';
            leftDiv.innerHTML = '<h3>Motor Control</h3>';
            
            const toggleDiv = document.createElement('div');
            toggleDiv.className = 'odom-toggle';
            toggleDiv.innerHTML = '<input type="checkbox" id="useOdometry"><label for="useOdometry">Use odometry</label>';
            leftDiv.appendChild(toggleDiv);
            
            for (const cmdKey of leftCol) {
                const config = commandConfig[cmdKey];
                const row = document.createElement('div');
                row.className = 'cmd-row';
                
                const button = document.createElement('button');
                button.textContent = config.label;
                button.onclick = () => handleCommand(cmdKey);
                row.appendChild(button);
                
                for (const param of config.params) {
                    const label = document.createElement('label');
                    label.textContent = param.label + ':';
                    row.appendChild(label);
                    
                    const input = document.createElement('input');
                    input.type = 'number';
                    input.id = 'param_' + cmdKey + '_' + param.id;
                    input.value = param.default;
                    if (param.min !== undefined) input.min = param.min;
                    if (param.max !== undefined) input.max = param.max;
                    if (param.step !== undefined) input.step = param.step;
                    row.appendChild(input);

                    if (cmdKey === 'motors_setpid') {
                        input.style.width = '90px';
                        if (param.id === 'Kp' || param.id === 'Ki' || param.id === 'Kd') {
                            input.step = '0.5';
                        }
                    }
                    if (cmdKey === 'motors_setrpm') {
                        if (param.id === 'target_rpm') {
                            input.style.width = '90px';
                        }
                        if (param.id === 'motor') {
                            input.style.width = '60px';
                        }
                    }
                    if (cmdKey === 'motors_getrpm') {
                        if (param.id === 'motor') {
                            input.style.width = '60px';
                        }
                    }
                }
                
                leftDiv.appendChild(row);
            }

            const motorExtras = ['request_rpm', 'reset_odom', 'read_rpm'];
            const extrasRow = document.createElement('div');
            extrasRow.className = 'cmd-row';

            for (const cmdKey of motorExtras) {
                const config = commandConfig[cmdKey];
                const button = document.createElement('button');
                button.textContent = config.label;
                button.onclick = () => handleCommand(cmdKey);
                extrasRow.appendChild(button);

                for (const param of (config.params || [])) {
                    const label = document.createElement('label');
                    label.textContent = param.label + ':';
                    extrasRow.appendChild(label);

                    const input = document.createElement('input');
                    input.type = 'number';
                    input.id = 'param_' + cmdKey + '_' + param.id;
                    input.value = param.default;
                    if (param.min !== undefined) input.min = param.min;
                    if (param.max !== undefined) input.max = param.max;
                    if (param.step !== undefined) input.step = param.step;
                    extrasRow.appendChild(input);
                }
            }
            leftDiv.appendChild(extrasRow);
            
            const rightDiv = document.createElement('div');
            rightDiv.className = 'cmd-col';
            rightDiv.innerHTML = '<h3>RPM & Odometry</h3>';
            
            for (const cmdKey of rightCol) {
                const config = commandConfig[cmdKey];

                if (cmdKey === 'motors_setpid') {
                    const topRow = document.createElement('div');
                    topRow.className = 'cmd-row';
                    topRow.classList.add('pid-top');
                    const bottomRow = document.createElement('div');
                    bottomRow.className = 'cmd-row pid-bottom';

                    const button = document.createElement('button');
                    button.textContent = config.label;
                    button.onclick = () => handleCommand(cmdKey);
                    topRow.appendChild(button);

                    const pidModeSelect = document.createElement('select');
                    pidModeSelect.id = 'pidModeSelect';
                    pidModeSelect.style.cssText = 'width: 70px; padding: 6px; background: #333; color: #e0e0e0; border: 1px solid #444; border-radius: 3px; font-size: 11px; margin-right: 6px;';
                    const motorOption = document.createElement('option');
                    motorOption.value = 'motors';
                    motorOption.textContent = 'Motors';
                    const customOption = document.createElement('option');
                    customOption.value = 'custom';
                    customOption.textContent = 'Custom';
                    customOption.selected = true;
                    pidModeSelect.appendChild(motorOption);
                    pidModeSelect.appendChild(customOption);
                    topRow.appendChild(pidModeSelect);

                    for (const param of config.params) {
                        const label = document.createElement('label');
                        label.textContent = param.label + ':';

                        const input = document.createElement('input');
                        input.type = 'number';
                        input.id = 'param_' + cmdKey + '_' + param.id;
                        input.value = param.default;
                        if (param.min !== undefined) input.min = param.min;
                        if (param.max !== undefined) input.max = param.max;
                        if (param.step !== undefined) input.step = param.step;

                        // Wider inputs and distribution across two rows
                        if (param.id === 'motor') {
                            input.style.width = '45px';
                            const group = document.createElement('div');
                            group.className = 'pid-group pid-motor';
                            group.appendChild(label);
                            group.appendChild(input);
                            topRow.appendChild(group);
                        } else if (param.id === 'Kp' || param.id === 'Ki') {
                            input.style.width = '75px';
                            input.step = (param.step === undefined) ? '0.5' : param.step;
                            const group = document.createElement('div');
                            group.className = (param.id === 'Kp') ? 'pid-group pid-kp' : 'pid-group pid-ki';
                            group.appendChild(label);
                            group.appendChild(input);
                            topRow.appendChild(group);
                        } else if (param.id === 'Kd') {
                            input.style.width = '75px';
                            input.step = (param.step === undefined) ? '0.5' : param.step;
                            const group = document.createElement('div');
                            group.className = 'pid-group pid-kd';
                            group.appendChild(label);
                            group.appendChild(input);
                            bottomRow.appendChild(group);
                        } else if (param.id === 'integral_limit') {
                            input.style.width = '75px';
                            input.step = (param.step === undefined) ? '0.5' : param.step;
                            const group = document.createElement('div');
                            group.className = 'pid-group pid-ilim';
                            group.appendChild(label);
                            group.appendChild(input);
                            bottomRow.appendChild(group);
                        } else {
                            const group = document.createElement('div');
                            group.className = 'pid-group';
                            group.appendChild(label);
                            group.appendChild(input);
                            topRow.appendChild(group);
                        }
                    }

                    rightDiv.appendChild(topRow);
                    rightDiv.appendChild(bottomRow);
                } else {
                    const row = document.createElement('div');
                    row.className = 'cmd-row';

                    const button = document.createElement('button');
                    button.textContent = config.label;
                    button.onclick = () => handleCommand(cmdKey);
                    row.appendChild(button);

                    for (const param of config.params) {
                        const label = document.createElement('label');
                        label.textContent = param.label + ':';
                        row.appendChild(label);

                        const input = document.createElement('input');
                        input.type = 'number';
                        input.id = 'param_' + cmdKey + '_' + param.id;
                        input.value = param.default;
                        if (param.min !== undefined) input.min = param.min;
                        if (param.max !== undefined) input.max = param.max;
                        if (param.step !== undefined) input.step = param.step;
                        row.appendChild(input);
                    }

                    rightDiv.appendChild(row);
                }
            }
            
            grid.appendChild(leftDiv);
            grid.appendChild(rightDiv);
            
            const missionControl = document.getElementById('missionControl');
            const missionTitle = document.createElement('h3');
            missionTitle.style.cssText = 'color: #4CAF50; font-size: 14px; margin-bottom: 8px; font-weight: normal; opacity: 0.8;';
            missionTitle.textContent = 'Mission Control';
            missionControl.appendChild(missionTitle);
            
            for (const cmdKey of missionCol) {
                const config = commandConfig[cmdKey];
                const row = document.createElement('div');
                row.className = 'cmd-row';
                
                const button = document.createElement('button');
                button.textContent = config.label;
                button.onclick = () => handleCommand(cmdKey);
                row.appendChild(button);
                
                if (cmdKey === 'measure' && config.sensorCount) {
                    const sensorLabel = document.createElement('label');
                    sensorLabel.textContent = 'Sensor ID:';
                    sensorLabel.style.marginRight = '8px';
                    row.appendChild(sensorLabel);
                    
                    for (let i = 0; i < config.sensorCount; i++) {
                        const checkbox = document.createElement('input');
                        checkbox.type = 'checkbox';
                        checkbox.id = 'sensor_' + i;
                        checkbox.className = 'sensor-checkbox';
                        checkbox.checked = (i < 3);  // First 3 sensors checked by default
                        row.appendChild(checkbox);
                        
                        const label = document.createElement('label');
                        label.textContent = i;
                        label.style.marginRight = '8px';
                        row.appendChild(label);
                    }
                } else {
                    for (const param of config.params) {
                        const label = document.createElement('label');
                        label.textContent = param.label + ':';
                        row.appendChild(label);
                        
                        const input = document.createElement('input');
                        input.type = 'number';
                        input.id = 'param_' + cmdKey + '_' + param.id;
                        input.value = param.default;
                        if (param.min !== undefined) input.min = param.min;
                        if (param.max !== undefined) input.max = param.max;
                        if (param.step !== undefined) input.step = param.step;
                        row.appendChild(input);
                    }
                }
                
                missionControl.appendChild(row);
            }
            
            const buildRow = document.createElement('div');
            buildRow.className = 'cmd-row';
            buildRow.style.marginTop = '12px';
            buildRow.style.borderTop = '1px solid #444';
            buildRow.style.paddingTop = '12px';
            
            const startBuildBtn = document.createElement('button');
            startBuildBtn.id = 'startBuildBtn';
            startBuildBtn.textContent = 'Start Building';
            startBuildBtn.onclick = startMissionBuild;
            buildRow.appendChild(startBuildBtn);
            
            const addTaskBtn = document.createElement('button');
            addTaskBtn.id = 'addTaskBtn';
            addTaskBtn.textContent = 'Add Task';
            addTaskBtn.disabled = true;
            addTaskBtn.onclick = addTaskToMission;
            buildRow.appendChild(addTaskBtn);
            
            const finishBuildBtn = document.createElement('button');
            finishBuildBtn.id = 'finishBuildBtn';
            finishBuildBtn.textContent = 'Send Mission';
            finishBuildBtn.disabled = true;
            finishBuildBtn.onclick = finishMissionBuild;
            buildRow.appendChild(finishBuildBtn);
            
            const cancelBuildBtn = document.createElement('button');
            cancelBuildBtn.id = 'cancelBuildBtn';
            cancelBuildBtn.textContent = 'Cancel Build';
            cancelBuildBtn.disabled = true;
            cancelBuildBtn.style.background = '#f44336';
            cancelBuildBtn.onclick = cancelMissionBuild;
            buildRow.appendChild(cancelBuildBtn);
            
            missionControl.appendChild(buildRow);
            
            const controlRow = document.createElement('div');
            controlRow.className = 'cmd-row';
            controlRow.style.marginTop = '8px';
            controlRow.id = 'missionControlActions';
            
            const cancelMissionBtn = document.createElement('button');
            cancelMissionBtn.id = 'cancelMissionBtn';
            cancelMissionBtn.textContent = 'Cancel Mission';
            cancelMissionBtn.onclick = () => handleCommand('cancel');
            controlRow.appendChild(cancelMissionBtn);
            
            const cancelMissionIdLabel = document.createElement('label');
            cancelMissionIdLabel.textContent = 'ID:';
            controlRow.appendChild(cancelMissionIdLabel);
            
            const cancelMissionIdInput = document.createElement('input');
            cancelMissionIdInput.type = 'number';
            cancelMissionIdInput.id = 'param_cancel_mission_id';
            cancelMissionIdInput.value = 0;
            cancelMissionIdInput.min = 0;
            controlRow.appendChild(cancelMissionIdInput);
            
            const emStopBtn = document.createElement('button');
            emStopBtn.id = 'emStopBtn';
            emStopBtn.textContent = 'Emergency Stop';
            emStopBtn.style.background = '#f44336';
            emStopBtn.onclick = () => handleCommand('stop');
            controlRow.appendChild(emStopBtn);
            
            missionControl.appendChild(controlRow);
            
            const statusDiv = document.createElement('div');
            statusDiv.id = 'buildStatus';
            statusDiv.style.cssText = 'margin-top: 8px; padding: 8px; background: #1a1a1a; border-radius: 3px; font-family: monospace; font-size: 11px; min-height: 20px; display: none;';
            missionControl.appendChild(statusDiv);
        }
        
        function startMissionBuild() {
            missionBuildMode = true;
            missionBuildString = '';
            currentTaskActions = [];
            isFirstAddTask = true;
            
            // Uncheck instant send
            document.getElementById('instantSend').checked = false;
            
            document.getElementById('startBuildBtn').disabled = true;
            document.getElementById('addTaskBtn').disabled = false;
            document.getElementById('finishBuildBtn').disabled = false;
            document.getElementById('cancelBuildBtn').disabled = false;
            
            const statusDiv = document.getElementById('buildStatus');
            statusDiv.style.display = 'block';
            statusDiv.textContent = 'Building mission... (add actions then click "Add Task")';
            statusDiv.style.color = '#4CAF50';
            
            addLog('> Started mission building mode', 'command');
        }
        
        function addTaskToMission() {
            // First press does nothing silently
            if (isFirstAddTask) {
                isFirstAddTask = false;
                return;
            }
            
            if (currentTaskActions.length === 0) {
                return;
            }
            
            // Add current task actions to mission string
            const taskString = currentTaskActions.join(',');
            if (missionBuildString.length > 0) {
                missionBuildString += ';'; // TASK_DELIMITER
            }
            missionBuildString += taskString;
            
            currentTaskActions = [];
            
            const statusDiv = document.getElementById('buildStatus');
            statusDiv.textContent = 'Mission: ' + missionBuildString + ' (add more actions or send)';
            
            addLog('> Task added: ' + taskString, 'command');
        }
        
        function finishMissionBuild() {
            if (currentTaskActions.length > 0) {
                const taskString = currentTaskActions.join(',');
                if (missionBuildString.length > 0) {
                    missionBuildString += ';';
                }
                missionBuildString += taskString;
            }
            
            if (missionBuildString.length === 0) {
                addLog('ERROR: No actions in mission', 'response');
                return;
            }
            
            // Send mission command
            const request = {
                cmd: 'mission',
                type: 0,
                values: missionBuildString.split(',').length,
                params: missionBuildString
            };
            
            fetch('/command', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(request)
            })
            .then(response => response.json())
            .then(data => {
                addLog('> mission:' + missionBuildString, 'command');
                if (data && data.response) {
                    addLog('< ' + data.response, 'response');
                }
                pollLogs();
                cancelMissionBuild();
            })
            .catch(error => {
                addLog('ERROR: ' + error, 'response');
                cancelMissionBuild();
            });
        }
        
        function cancelMissionBuild() {
            missionBuildMode = false;
            missionBuildString = '';
            currentTaskActions = [];
            isFirstAddTask = true;
            
            // Re-enable instant send
            document.getElementById('instantSend').checked = true;
            
            document.getElementById('startBuildBtn').disabled = false;
            document.getElementById('addTaskBtn').disabled = true;
            document.getElementById('finishBuildBtn').disabled = true;
            document.getElementById('cancelBuildBtn').disabled = true;
            
            document.getElementById('buildStatus').style.display = 'none';
            
            addLog('> Mission building cancelled', 'response');
        }
        
        function pollLogs() {
            if (pollInFlight) {
                return;
            }
            pollInFlight = true;

            fetch('/logs?since=' + lastLogId)
                .then(response => {
                    if (!response.ok) {
                        console.error('Log poll failed:', response.status);
                        return null;
                    }
                    return response.json();
                })
                .then(logs => {
                    if (!logs) return;
                    
                    if (Array.isArray(logs) && logs.length > 0) {
                        const logsDiv = document.getElementById('logs');
                        const wasAtBottom = logsDiv.scrollHeight - logsDiv.scrollTop <= logsDiv.clientHeight + 50;
                        
                        let maxId = lastLogId;
                        logs.forEach(logObj => {
                            if (logObj && typeof logObj.id === 'number' && logObj.message) {
                                const entry = document.createElement('div');
                                entry.className = 'log-entry ' + (logObj.message.startsWith('>') ? 'command' : 'response');
                                entry.textContent = logObj.message;
                                logsDiv.appendChild(entry);
                                
                                // Track the highest ID
                                if (logObj.id > maxId) {
                                    maxId = logObj.id;
                                }
                            }
                        });
                        
                        // Update lastLogId to highest ID seen
                        lastLogId = maxId;
                        
                        if (wasAtBottom && autoScroll) {
                            logsDiv.scrollTop = logsDiv.scrollHeight;
                        }
                    }
                })
                .catch(error => {
                    console.error('Error fetching logs:', error);
                })
                .finally(() => {
                    pollInFlight = false;
                });
        }
        
        function handleCommand(cmdKey) {
            let actualCmd = cmdKey;
            let skipMotorId = false;
            
            // For motor commands, check odometry toggle
            if (cmdKey === 'motors_set' || cmdKey === 'motors_stop') {
                const useOdom = document.getElementById('useOdometry').checked;
                if (useOdom) {
                    actualCmd = cmdKey.replace('motors_', 'modom_');
                }
            }
            
            // For PID command, check mode selector
            if (cmdKey === 'motors_setpid') {
                const pidMode = document.getElementById('pidModeSelect')?.value;
                if (pidMode === 'custom') {
                    actualCmd = 'set_pid:';
                    skipMotorId = true;
                }
            }
            
            const config = commandConfig[cmdKey];
            if (!config) return;
            
            const params = [];
            let sensorByte = null;
            
            if (cmdKey === 'measure') {
                let sensorMask = 0;
                const sensorCount = config.sensorCount || 8;
                for (let i = 0; i < sensorCount; i++) {
                    const checkbox = document.getElementById(`sensor_${i}`);
                    if (checkbox && checkbox.checked) {
                        sensorMask |= (1 << i);
                    }
                }
                sensorByte = sensorMask;
            } else {
                for (const param of config.params) {
                    if (skipMotorId && param.id === 'motor') {
                        continue;
                    }
                    const baseKey = cmdKey.replace('modom_', 'motors_');
                    const inputId = 'param_' + baseKey + '_' + param.id;
                    const elem = document.getElementById(inputId);
                    if (elem) {
                        let v = (elem.value !== undefined && elem.value !== null) ? String(elem.value).trim() : '';
                        if (v === '') {
                            v = (param.default !== undefined && param.default !== null) ? String(param.default) : '0';
                            elem.value = v;
                        }
                        params.push(v);
                    }
                }
            }
            
            if (missionBuildMode && (cmdKey === 'mission' || cmdKey === 'measure' || cmdKey === 'wall_follow')) {
                let actionType;
                if (cmdKey === 'mission') {
                    actionType = '0';
                } else if (cmdKey === 'measure') {
                    actionType = '1';
                } else if (cmdKey === 'wall_follow') {
                    actionType = '2';
                }
                
                const actionParams = (cmdKey === 'measure') ? [sensorByte] : params;
                const actionString = [actionType, ...actionParams].join(',');
                currentTaskActions.push(actionString);
                
                const statusDiv = document.getElementById('buildStatus');
                const displayPreview = (cmdKey === 'measure') ? '1,0x' + sensorByte.toString(16).toUpperCase().padStart(2, '0') : actionString;
                statusDiv.textContent = 'Current task: ' + displayPreview + ' (click "Add Task" or add more actions)';
                
                addLog('> Added action: ' + displayPreview, 'command');
                return;
            }
            
            // Special formatting for mission command
            if (cmdKey === 'mission') {
                actualCmd = 'mission';
                params.unshift('0');
            } else if (cmdKey === 'measure') {
                actualCmd = 'mission';
                params.unshift('1');
                params.push(sensorByte);
            } else if (cmdKey === 'wall_follow') {
                // Wall follow sends combined message: measure + wall_follow
                actualCmd = 'mission';
                
                let wallFollowSensorMask = 0;
                const sensorCount = commandConfig.measure.sensorCount || 8;
                for (let i = 0; i < sensorCount; i++) {
                    const checkbox = document.getElementById(`sensor_${i}`);
                    if (checkbox && checkbox.checked) {
                        wallFollowSensorMask |= (1 << i);
                    }
                }
                
                params.unshift('1', wallFollowSensorMask, '2');
            }
            
            const instantSend = document.getElementById('instantSend').checked;
            
            if (instantSend) {
                const request = {
                    cmd: actualCmd,
                    type: config.type,
                    values: params.length,
                    params: (cmdKey === 'measure') ? '1,' : params.join(','),
                    sensorByte: (cmdKey === 'measure') ? sensorByte : undefined
                };
                
                fetch('/command', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(request)
                })
                .then(response => response.json())
                .then(data => {
                    // Rely on server-side logs to avoid duplicate entries in the UI.
                    pollLogs();
                })
                .catch(error => {
                    console.error('Command error:', error);
                    addLog('ERROR: ' + error, 'response');
                });
            } else {
                document.getElementById('customCmd').value = actualCmd;
                document.getElementById('customType').value = config.type.toString();
                document.getElementById('customValues').value = params.length.toString();
                document.getElementById('customParams').value = params.join(',');
            }
        }
        
        function sendCustomCommand() {
            const cmd = document.getElementById('customCmd').value.trim();
            const type = parseInt(document.getElementById('customType').value);
            const paramsStr = document.getElementById('customParams').value.trim();
            
            if (!cmd) return;
            
            const valuesCount = paramsStr ? paramsStr.split(',').filter(x => x.trim().length > 0).length : 0;
            const request = {
                cmd: cmd,
                type: type,
                values: valuesCount,
                params: paramsStr
            };
            
            fetch('/command', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(request)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // Rely on server-side logs to avoid duplicates.
                    pollLogs();
                } else {
                    addLog('ERROR: ' + (data.response || 'Command failed'), 'response');
                }
            })
            .catch(error => {
                addLog('ERROR: ' + error, 'response');
            });
            
            // Clear fields
            document.getElementById('customCmd').value = '';
            document.getElementById('customValues').value = '';
            document.getElementById('customParams').value = '';
        }
        
        function addLog(message, cls) {
            const logsDiv = document.getElementById('logs');
            const entry = document.createElement('div');
            entry.className = 'log-entry ' + (cls || (message.startsWith('>') ? 'command' : 'response'));
            entry.textContent = message;
            logsDiv.appendChild(entry);
            if (autoScroll) logsDiv.scrollTop = logsDiv.scrollHeight;
        }

        function connectToLogs() {
            // start polling immediately and then on interval (1000ms for less frequent updates)
            pollLogs();
            setInterval(pollLogs, 1000);
        }

        function clearLogs() {
            const logsDiv = document.getElementById('logs');
            if (logsDiv) {
                logsDiv.innerHTML = '';
            }
        }

        generateCommandUI();
        connectToLogs();

        document.getElementById('clearLogsBtn').addEventListener('click', clearLogs);
        
        // Attach event listeners to custom command fields
        document.getElementById('customCmd').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendCustomCommand();
        });
        document.getElementById('customParams').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendCustomCommand();
        });
        document.getElementById('sendCustomBtn').addEventListener('click', sendCustomCommand);
    </script>
</body>
